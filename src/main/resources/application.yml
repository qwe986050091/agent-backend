server:
  port: 8081

# ===== 管理端口（actuator/prometheus） =====
# 独立端口且只绑 127.0.0.1：只供本机 Prometheus 抓取/排障，不经 nginx、不走安全组。
management:
  server:
    port: ${MANAGEMENT_PORT:18081}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: agent-backend

  # ===== MySQL 数据源 =====
  datasource:
    # createDatabaseIfNotExist=true：库不存在时自动创建 agent_chat（表结构由 schema.sql 创建）
    url: jdbc:mysql://localhost:3306/agent_chat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    # 用户名/密码必须由环境变量注入（生产 systemd unit 的 Environment=MYSQL_USER/MYSQL_PASSWORD）；
    # 本地：PowerShell $env:MYSQL_PASSWORD="..." 或 IDE 运行配置；密码不再保留明文默认值，
    # 未配置时 Hikari 启动即连接失败（fail-fast）
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===== 建表脚本自动执行（幂等，CREATE TABLE IF NOT EXISTS） =====
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # ===== JPA / Hibernate（表结构由 schema.sql 管理，Hibernate 只做映射） =====
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  # ===== Redis（登录会话 + 失败限流） =====
  # 密码由环境变量 REDIS_PASSWORD 注入（生产 systemd unit 配好 Redis requirepass 后设置）；
  # 本地无密码 Redis 留空即可。未配置时连接失败会在登录/鉴权时报错（fail-fast 风格）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  # 文件上传大小限制：Skill 上传 + 知识库文档（P1-9.2 起支持 PDF/Office，最大 20MB）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

# ===== Agent 服务（d:\code\agent 工程，LangChain4j） =====
agent:
  service:
    base-url: ${AGENT_BASE_URL:http://localhost:8080}
    connect-timeout: 5s
    read-timeout: 120s
    # JDK HttpClient 连接池响应处理线程数
    http-pool-threads: 8
    # 服务间鉴权 token（请求头 X-Agent-Token），生产由环境变量 AGENT_INTERNAL_TOKEN 注入，须与 agent 侧一致
    internal-token: ${AGENT_INTERNAL_TOKEN:dev-internal-token}
  # ===== 调用 agent 的韧性策略（Resilience4j） =====
  resilience:
    circuit-breaker:
      failure-rate-threshold: 50      # 窗口内失败率 ≥50% → 熔断 OPEN
      sliding-window-size: 20         # 计数滑动窗口（最近 20 次调用）
      minimum-number-of-calls: 5      # 至少 5 次调用才开始计算失败率
      wait-in-open: 30s               # OPEN 30s 后进入 HALF_OPEN 探测
      permitted-calls-in-half-open: 3 # HALF_OPEN 放行 3 次探测
    retry:
      max-attempts: 2                 # 最多尝试 2 次（即 1 次重试），仅连接失败/读超时/5xx
      wait-duration: 1s

# ===== LLM 计费单价（元 / 百万 token；P2-10 token 成本统计） =====
# 依据 DeepSeek 官方 2026-09 公开刊例价（api-docs.deepseek.com）；
# 注意：TokenUsage 未拆分缓存命中 token，输入统一按「缓存未命中」价（保守估算，可能略高估）；
# 峰谷定价（Flash 0731 正式版）未区分，统一按闲时价。改价只需改这里重启，无需改代码。
billing:
  models:
    # deepseek-chat 是 deepseek-v4-flash 非思考模式的兼容别名，同价；
    # deepseek-flash 是 API 响应 metadata.modelName 实际返回的模型名（线上实测）
    deepseek-v4-flash:
      input-per-mtok: 1
      output-per-mtok: 2
    deepseek-flash:
      input-per-mtok: 1
      output-per-mtok: 2
    deepseek-chat:
      input-per-mtok: 1
      output-per-mtok: 2
    deepseek-v4-pro:
      input-per-mtok: 3
      output-per-mtok: 6
    deepseek-v4-flash-vision-exp:
      input-per-mtok: 1.5
      output-per-mtok: 4.5

# ===== 管理员白名单（P2-11.1 bad case 后台） =====
# 逗号分隔的用户名（生产由 systemd Environment=APP_ADMIN_USERNAMES 注入）；
# 留空=无任何管理员，/api/admin/** 一律 403（fail-closed）
app:
  admin:
    usernames: ${APP_ADMIN_USERNAMES:}
  # ===== 对话图片（P1-8 多模态，deepseek-flash 原生视觉） =====
  chat:
    image:
      enabled: ${CHAT_IMAGE_ENABLED:true}
      max-count: 3                                           # 单条消息图片数
      max-size-bytes: ${CHAT_IMAGE_MAX_SIZE:5242880}         # 单图原始字节 ≤5MB（3 张 base64 ≈20MB，nginx 25m 内）
      dir: ${CHAT_IMAGE_DIR:data/chat-images}                # 落盘目录（生产 /opt/agent-data/chat-images）
  # ===== 定时/主动 Agent（P2-9；enabled=false 即刻停调度，数据保留，可作回滚手段） =====
  task:
    enabled: ${APP_TASK_ENABLED:true}
    poll-interval-seconds: ${APP_TASK_POLL_INTERVAL_SECONDS:30}
    max-per-user: ${APP_TASK_MAX_PER_USER:10}                # 每用户启用任务上限
    min-interval-minutes: ${APP_TASK_MIN_INTERVAL_MINUTES:5} # cron 前 5 次执行最小间隔校验
    max-runs-per-day: ${APP_TASK_MAX_RUNS_PER_DAY:24}        # 每任务每日执行上限（含 run-now）
    max-concurrent-runs: ${APP_TASK_MAX_CONCURRENT_RUNS:2}   # 执行池大小
    zone: ${APP_TASK_ZONE:Asia/Shanghai}
    lock-ttl-seconds: ${APP_TASK_LOCK_TTL_SECONDS:900}       # Redis 任务锁兜底 TTL
    zombie-timeout-minutes: ${APP_TASK_ZOMBIE_TIMEOUT_MINUTES:30}

# ===== 用户级限流与配额（P0-4：防死循环 prompt / 被盗会话无上限烧 token） =====
# 三道闸门均按用户名维度；任一阈值置 0 = 关闭该闸门。生产阈值经 systemd Environment 注入。
ratelimit:
  enabled: ${RATELIMIT_ENABLED:true}
  requests-per-minute: ${RATELIMIT_REQUESTS_PER_MINUTE:20}   # 每用户每分钟最多发起的回合数
  max-concurrent: ${RATELIMIT_MAX_CONCURRENT:4}              # 每用户同时在途对话（同步调用 + SSE）
  daily-token-budget: ${RATELIMIT_DAILY_TOKEN_BUDGET:2000000} # 每用户每日 token 上限，0=不限
  concurrent-ttl-seconds: 360                                # 在途键兜底 TTL，必须 > SSE 超时 5 分钟
  exempt-admins: true                                        # 管理员白名单豁免

# ===== 认证（登录会话 + 失败限流） =====
auth:
  # 会话有效期（秒）：每次携带有效 token 的请求自动滑动续期；到期后 401 自动跳登录
  session-ttl-seconds: 604800   # 7 天
  # 登录失败限流：fail-window 秒窗口内失败 max-failures 次 → 锁定 lock-seconds 秒（按用户名 + IP 双维度）
  fail-window-seconds: 600      # 10 分钟
  max-failures: 5
  lock-seconds: 900             # 15 分钟

# ===== 日志配置 =====
logging:
  level:
    com.example: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN
  pattern:
    # [traceId] 串联 frontend→backend→agent 全链路（无 trace 时显示 -）
    console: "%d{HH:mm:ss} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
